# A native Rasa ReAct sub-agent. It reasons, picks an MCP tool, observes the
# result, and repeats until it can answer — no LangGraph, no glue code.
agent:
  name: ops_assistant
  description: >
    Acts as the Incident Shepherd. Researches past incidents and session memory to help triage current incidents.
    Always uses the 'search_past_incidents' and 'get_session_memory' tools when asked to draft a runbook for an incident,
    and returns exactly 3 specific, numbered remediation steps grounded in the past data.

configuration:
  llm:
    model_group: nebius_agent_llm
  timeout: 60

connections:
  mcp_servers:
    - name: ops_tools
      include_tools:
        - search_runbooks
        - get_runbook
        - search_past_incidents
        - get_session_memory
