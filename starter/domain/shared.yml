version: "3.1"

actions:
  - action_recall_session

slots:
  return_value:
    type: any
    mappings:
      - type: controlled
  incident_service:
    type: text
    influence_conversation: true
    mappings:
      - type: from_llm
  incident_symptom:
    type: text
    influence_conversation: true
    mappings:
      - type: from_llm
  incident_severity:
    type: text
    influence_conversation: true
    mappings:
      - type: from_llm
  approval_to_proceed:
    type: text
    influence_conversation: true
    mappings:
      - type: from_llm

responses:
  utter_ask_incident_service:
    - text: "Which service or system is affected? (e.g., payments, auth, database)"
  utter_ask_incident_symptom:
    - text: "What is the symptom or error? What are users experiencing?"
  utter_ask_incident_severity:
    - text: "What is the severity level? (e.g., P1, P2, P3)"
  utter_ask_approval_to_proceed:
    - text: "I have drafted a runbook for this incident. Do you approve proceeding with it? (Yes/No)"
  utter_can_do_something_else:
    - text: "Is there any other task I can assist you with?"
  utter_goodbye:
    - text: "Thanks for working with me — I'll be right here whenever you need me."
  utter_chitchat:
    - text: "I'm focused on helping you manage support tickets and your task scratchpad. Let me know if you need to open a ticket, check a status, or manage your to-do list."
  utter_cannot_handle:
    - text: "I'm sorry, I don't know how to handle that request. I can help you log support tickets, check ticket status, or manage your scratchpad (add tasks, list todos, mark items done)."
