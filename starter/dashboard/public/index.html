<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rasa AI Coworker Dashboard</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --panel-bg: #1e2130;
            --text-color: #a6accd;
            --accent-color: #c792ea;
            --accent-hover: #b678de;
            --border-color: #2b3045;
            --user-bubble: #82aaff;
            --agent-bubble: #c3e88d;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 1rem 2rem;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #ffffff;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--accent-color);
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: 1rem;
            gap: 1rem;
        }

        .terminals-container {
            flex: 2;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 1rem;
        }

        .terminal-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .panel-header {
            background-color: rgba(0,0,0,0.2);
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            font-weight: bold;
            color: #fff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
        }

        .terminal-output {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 0.8rem;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #bcc2cd;
        }

        .terminal-output .stderr {
            color: #f07178;
        }

        /* Custom Scrollbar for terminals */
        .terminal-output::-webkit-scrollbar {
            width: 8px;
        }
        .terminal-output::-webkit-scrollbar-track {
            background: var(--panel-bg); 
        }
        .terminal-output::-webkit-scrollbar-thumb {
            background: #393f5a; 
            border-radius: 4px;
        }

        .chat-container {
            flex: 1;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            position: relative;
        }

        .chat-history {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .chat-bubble {
            max-width: 80%;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bubble-user {
            align-self: flex-end;
            background-color: rgba(130, 170, 255, 0.1);
            border: 1px solid var(--user-bubble);
            color: #e0e0e0;
            border-bottom-right-radius: 2px;
        }

        .bubble-agent {
            align-self: flex-start;
            background-color: rgba(195, 232, 141, 0.1);
            border: 1px solid var(--agent-bubble);
            color: #e0e0e0;
            border-bottom-left-radius: 2px;
        }

        .chat-controls {
            padding: 1rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            background-color: rgba(0,0,0,0.1);
        }

        .mic-btn {
            background: linear-gradient(135deg, var(--accent-color), #89ddff);
            border: none;
            border-radius: 50%;
            width: 64px;
            height: 64px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(199, 146, 234, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .mic-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(199, 146, 234, 0.6);
        }

        .mic-btn:active {
            transform: scale(0.95);
        }

        .mic-btn.recording {
            animation: pulse 1.5s infinite;
            background: linear-gradient(135deg, #f07178, #ff5370);
            box-shadow: 0 4px 15px rgba(240, 113, 120, 0.5);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(240, 113, 120, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(240, 113, 120, 0); }
            100% { box-shadow: 0 0 0 0 rgba(240, 113, 120, 0); }
        }

        .mic-icon {
            fill: #1e2130;
            width: 28px;
            height: 28px;
        }

        .status-text {
            font-size: 0.8rem;
            color: #89ddff;
            height: 1.2rem;
        }

        /* Terminal Logs Colors */
        .log-info { color: #bcc2cd; }
        .log-error { color: #f07178; }
        
        .action-btn {
            background-color: var(--border-color);
            color: var(--text-color);
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .action-btn:hover {
            background-color: #393f5a;
        }
        
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #f07178; /* red by default, turned green when running */
        }
        
        .right-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .data-container {
            flex: 1;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .data-content {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            font-size: 0.85rem;
        }

        .db-section-title {
            color: var(--accent-color);
            font-weight: bold;
            margin-bottom: 0.5rem;
            margin-top: 1rem;
        }
        .db-section-title:first-child { margin-top: 0; }

        .db-item {
            background-color: rgba(0,0,0,0.2);
            padding: 0.5rem;
            border-radius: 4px;
            margin-bottom: 0.5rem;
            border-left: 3px solid var(--accent-color);
        }
        .db-item-title { font-weight: bold; color: #fff; margin-bottom: 0.25rem; }
        .db-item-status { font-size: 0.75rem; color: var(--user-bubble); }

    </style>
    <!-- Include Socket.io client -->
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <header>
        <div>
            <h1>Rasa Always-On Coworker</h1>
            <div class="subtitle">Live Dashboard</div>
        </div>
        <div>
            <div style="font-size: 0.8rem; display: flex; align-items: center; gap: 0.5rem;">
                <span style="display:inline-block; width: 8px; height: 8px; border-radius: 50%; background-color: #c3e88d;"></span>
                System Online
            </div>
        </div>
    </header>

    <div class="main-container">
        <!-- Terminal Grid -->
        <div class="terminals-container">
            <div class="terminal-panel" id="panel-mcp">
                <div class="panel-header">
                    <span>MCP Tool Server</span>
                    <div style="display:flex; gap:0.5rem; align-items:center;">
                        <button class="action-btn" onclick="socket.emit('restart', 'mcp')">Restart</button>
                        <button class="action-btn" onclick="socket.emit('kill', 'mcp')">Kill</button>
                        <span class="status-indicator" id="status-mcp"></span>
                        <span style="color:var(--user-bubble)">:8000</span>
                    </div>
                </div>
                <div class="terminal-output" id="term-mcp"></div>
            </div>
            <div class="terminal-panel" id="panel-actions">
                <div class="panel-header">
                    <span>Action Server</span>
                    <div style="display:flex; gap:0.5rem; align-items:center;">
                        <button class="action-btn" onclick="socket.emit('restart', 'actions')">Restart</button>
                        <button class="action-btn" onclick="socket.emit('kill', 'actions')">Kill</button>
                        <span class="status-indicator" id="status-actions"></span>
                        <span style="color:var(--accent-color)">:5055</span>
                    </div>
                </div>
                <div class="terminal-output" id="term-actions"></div>
            </div>
            <div class="terminal-panel" id="panel-rasa">
                <div class="panel-header">
                    <span>Rasa Agentic Server</span>
                    <div style="display:flex; gap:0.5rem; align-items:center;">
                        <button class="action-btn" onclick="socket.emit('restart', 'rasa')">Restart</button>
                        <button class="action-btn" onclick="socket.emit('kill', 'rasa')">Kill</button>
                        <span class="status-indicator" id="status-rasa"></span>
                        <span style="color:var(--agent-bubble)">:5005</span>
                    </div>
                </div>
                <div class="terminal-output" id="term-rasa"></div>
            </div>
            <div class="terminal-panel" id="panel-heartbeat">
                <div class="panel-header">
                    <span>Heartbeat Monitor</span>
                    <div style="display:flex; gap:0.5rem; align-items:center;">
                        <button class="action-btn" onclick="socket.emit('restart', 'heartbeat')">Restart</button>
                        <button class="action-btn" onclick="socket.emit('kill', 'heartbeat')">Kill</button>
                        <span class="status-indicator" id="status-heartbeat"></span>
                    </div>
                </div>
                <div class="terminal-output" id="term-heartbeat"></div>
            </div>
        </div>

        <!-- Right Column: Live Data + Chat UI -->
        <div class="right-column">
            <!-- Live Data UI -->
            <div class="data-container">
                <div class="panel-header">Live Agent Database</div>
                <div class="data-content" id="data-content">
                    <div style="color: #666; text-align: center; margin-top: 2rem;">Waiting for data...</div>
                </div>
            </div>

            <!-- Chat UI -->
            <div class="chat-container">
                <div class="panel-header">Live Interaction</div>
                <div class="chat-history" id="chat-history">
                    <div class="chat-bubble bubble-agent">
                        <strong>Coworker:</strong> Hi! I am your AI coworker. Press the microphone button and speak to interact with me.
                    </div>
                </div>
                
                <div class="chat-controls">
                    <div class="status-text" id="status-text">Ready</div>
                    <button class="mic-btn" id="mic-btn" title="Click to start/stop speaking">
                        <svg class="mic-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Socket.io for Terminal Logs ---
        const socket = io();

        const terminals = {
            mcp: document.getElementById('term-mcp'),
            actions: document.getElementById('term-actions'),
            rasa: document.getElementById('term-rasa'),
            heartbeat: document.getElementById('term-heartbeat')
        };
        
        const indicators = {
            mcp: document.getElementById('status-mcp'),
            actions: document.getElementById('status-actions'),
            rasa: document.getElementById('status-rasa'),
            heartbeat: document.getElementById('status-heartbeat')
        };

        socket.on('status', (msg) => {
            const ind = indicators[msg.id];
            if (ind) {
                ind.style.backgroundColor = msg.running ? '#c3e88d' : '#f07178';
                ind.title = msg.running ? 'Running' : 'Stopped';
            }
        });

        socket.on('log', (msg) => {
            const term = terminals[msg.id];
            if (term) {
                const span = document.createElement('span');
                // All output is normal (Rasa/MCP/Sanic write to stderr by default)
                if (msg.type === 'system') {
                    span.style.color = '#ffcb6b'; // yellow for exit messages
                    span.style.fontWeight = 'bold';
                } else {
                    span.style.color = '#bcc2cd';
                }
                // Escape HTML
                const safeText = msg.data.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                span.innerHTML = safeText;
                term.appendChild(span);
                
                // Auto scroll to bottom
                term.scrollTop = term.scrollHeight;
            }
        });
        
        socket.on('db-state', (data) => {
            const container = document.getElementById('data-content');
            let html = '';
            
            // DB work_items
            if (data.tickets && data.tickets.length > 0) {
                html += '<div class="db-section-title">Work Items (DB)</div>';
                data.tickets.forEach(t => {
                    const priorityColor = (t.priority === 'urgent' || t.priority === 'high') ? '#f07178' : '#89ddff';
                    html += `
                        <div class="db-item">
                            <div class="db-item-title">${t.id}: ${t.summary}</div>
                            <div class="db-item-status">
                                Status: <strong>${t.status}</strong>
                                ${t.priority ? ` · Priority: <span style="color:${priorityColor}">${t.priority}</span>` : ''}
                            </div>
                        </div>
                    `;
                });
            }

            // JSON tickets
            if (data.json_tickets && data.json_tickets.length > 0) {
                html += '<div class="db-section-title">Tickets (JSON)</div>';
                data.json_tickets.forEach(t => {
                    const priorityColor = (t.priority === 'urgent' || t.priority === 'high') ? '#f07178' : '#89ddff';
                    html += `
                        <div class="db-item">
                            <div class="db-item-title">${t.id}: ${t.summary}</div>
                            <div class="db-item-status">
                                Status: <strong>${t.status}</strong>
                                ${t.priority ? ` · Priority: <span style="color:${priorityColor}">${t.priority}</span>` : ''}
                            </div>
                        </div>
                    `;
                });
            }
            
            if (data.plans && data.plans.length > 0) {
                html += '<div class="db-section-title">Agent Runbooks</div>';
                data.plans.forEach(p => {
                    const statusIcon = p.status === 'completed' ? '✅' : p.status === 'active' ? '🔄' : '❌';
                    html += `
                        <div class="db-item" style="border-left-color: var(--agent-bubble)">
                            <div class="db-item-title">${statusIcon} ${p.id}: ${p.title}</div>
                            <div class="db-item-status" style="color: var(--agent-bubble)">Status: <strong>${p.status}</strong></div>
                        </div>
                    `;
                });
            }
            
            if (!html) html = '<div style="color: #666; text-align: center; margin-top: 2rem;">No active items found</div>';
            container.innerHTML = html;
        });

        // --- 2. Web Speech API (Voice & TTS) and Rasa REST ---
        const micBtn = document.getElementById('mic-btn');
        const statusText = document.getElementById('status-text');
        const chatHistory = document.getElementById('chat-history');

        const RASA_URL = "http://localhost:5005/webhooks/rest/webhook";
        const senderId = "dashboard-user";

        let isRecording = false;
        let accumulatedTranscript = "";
        
        // Setup Speech Recognition
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isRecording = true;
                accumulatedTranscript = "";
                micBtn.classList.add('recording');
                statusText.innerText = "Listening... (Release to send)";
                // Stop any ongoing speech synth when user starts speaking
                window.speechSynthesis.cancel();
            };

            recognition.onresult = (event) => {
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        accumulatedTranscript += event.results[i][0].transcript + " ";
                    }
                }
            };

            recognition.onerror = (event) => {
                console.error("Speech recognition error", event.error);
                statusText.innerText = `Error: ${event.error}`;
                stopRecordingUI();
            };

            recognition.onend = async () => {
                stopRecordingUI();
                const textToSend = accumulatedTranscript.trim();
                accumulatedTranscript = ""; // reset for next time
                
                if (textToSend) {
                    appendBubble('You', textToSend, 'bubble-user');
                    statusText.innerText = "Thinking...";
                    await sendToRasa(textToSend);
                } else {
                    if (statusText.innerText === "Thinking...") return; // don't overwrite if it was a quick error
                    statusText.innerText = "Ready";
                }
            };
        } else {
            statusText.innerText = "Web Speech API not supported in this browser.";
            micBtn.disabled = true;
            micBtn.style.opacity = 0.5;
        }

        function stopRecordingUI() {
            isRecording = false;
            micBtn.classList.remove('recording');
            if (statusText.innerText.startsWith("Listening")) {
                statusText.innerText = "Processing...";
            }
        }

        const startMic = (e) => {
            if (e) e.preventDefault();
            if (!recognition || isRecording) return;
            try { recognition.start(); } catch(e) {}
        };

        const stopMic = (e) => {
            if (e) e.preventDefault();
            if (!recognition || !isRecording) return;
            recognition.stop();
        };

        // Desktop
        micBtn.addEventListener('mousedown', startMic);
        window.addEventListener('mouseup', stopMic); // catch mouseup anywhere
        
        // Mobile
        micBtn.addEventListener('touchstart', startMic, {passive: false});
        window.addEventListener('touchend', stopMic);

        function appendBubble(sender, text, className) {
            const div = document.createElement('div');
            div.className = `chat-bubble ${className}`;
            div.innerHTML = `<strong>${sender}:</strong> ${text}`;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                
                // Try to find a good English voice
                const voices = window.speechSynthesis.getVoices();
                const preferredVoice = voices.find(v => v.name.includes('Google US English') || v.name.includes('Samantha') || v.lang === 'en-US');
                if (preferredVoice) utterance.voice = preferredVoice;
                
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                
                utterance.onstart = () => { statusText.innerText = "Speaking..."; };
                utterance.onend = () => { statusText.innerText = "Ready"; };
                
                window.speechSynthesis.speak(utterance);
            }
        }

        async function sendToRasa(text) {
            try {
                const response = await fetch(RASA_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sender: senderId, message: text })
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                
                if (data && data.length > 0) {
                    const fullReply = data.map(m => m.text).filter(Boolean).join("  ");
                    if (fullReply) {
                        appendBubble('Coworker', fullReply, 'bubble-agent');
                        speakText(fullReply);
                    } else {
                        statusText.innerText = "Ready";
                    }
                } else {
                    statusText.innerText = "Ready";
                }
            } catch (e) {
                console.error("Error communicating with Rasa:", e);
                appendBubble('System', 'Error: Could not reach Rasa at :5005. Is it running?', 'bubble-error');
                statusText.innerText = "Error connecting to Agent";
            }
        }

        // Load voices asynchronously
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }
    </script>
</body>
</html>
