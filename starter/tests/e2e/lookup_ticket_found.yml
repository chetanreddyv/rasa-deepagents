# End-to-end test for lookup ticket status - ticket found.
# Run with: RASA_PRO_BETA_STUB_CUSTOM_ACTION=true rasa test e2e tests/e2e

stub_custom_actions:
  action_lookup_ticket:
    events:
      - event: slot
        name: ticket_found
        value: true
      - event: slot
        name: ticket_summary
        value: "Wrong invoice totals"
      - event: slot
        name: ticket_status
        value: "open"
      - event: slot
        name: lookup_ticket_id
        value: "TCK-1234"

  action_init_plan:
    events: []

  action_advance_step:
    events: []

  action_complete_plan:
    events: []

test_cases:
  - test_case: user checks status of an existing ticket
    steps:
      - user: "Hi, check status of my ticket TCK-1234"
        assertions:
          - flow_started:
              operator: "all"
              flow_ids:
                - check_ticket_status
          - slot_was_set:
              - name: lookup_ticket_id
                value: "TCK-1234"
          - action_executed: action_lookup_ticket
          - bot_uttered:
              utter_name: utter_ticket_status
          - bot_uttered:
              utter_name: utter_can_do_something_else
