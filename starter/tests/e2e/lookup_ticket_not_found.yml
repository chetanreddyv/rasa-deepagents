# End-to-end test for lookup ticket status - ticket not found.
# Run with: RASA_PRO_BETA_STUB_CUSTOM_ACTION=true rasa test e2e tests/e2e

stub_custom_actions:
  action_lookup_ticket:
    events:
      - event: slot
        name: ticket_found
        value: false
      - event: slot
        name: lookup_ticket_id
        value: "TCK-9999"

  action_init_plan:
    events: []

  action_advance_step:
    events: []

  action_complete_plan:
    events: []

test_cases:
  - test_case: user checks status of a non-existing ticket
    steps:
      - user: "Hi, check status of my ticket TCK-9999"
        assertions:
          - flow_started:
              operator: "all"
              flow_ids:
                - check_ticket_status
          - slot_was_set:
              - name: lookup_ticket_id
                value: "TCK-9999"
          - action_executed: action_lookup_ticket
          - bot_uttered:
              utter_name: utter_ticket_not_found
