flows:
  complete_todo:
    description: >
      Mark a scratchpad task as done or completed. Triggers when the user wants
      to complete, finish, check off, or mark a specific task as done —
      e.g. "mark TODO-0001 as done", "complete todo 3", "I finished task 2".
    steps:
      - collect: complete_todo_id
        description: The identifier of the task to complete, for example TODO-0001.
      - action: action_complete_todo
        next:
          - if: slots.todo_completed
            then:
              - action: utter_todo_completed
                next: wrap_up
          - else:
              - action: utter_todo_complete_failed
                next: wrap_up
      - id: wrap_up
        action: utter_can_do_something_else
