flows:
  recall_session:
    description: >
      Recall or remember what happened in previous conversations, sessions,
      or recently completed tasks. Triggers when the user asks about past
      work WITHOUT providing a specific ticket ID — for example: "what was
      the recent ticket?", "what did we work on?", "what was the last issue?",
      "summarize what happened", or similar. Do NOT use check_ticket_status for these;
      check_ticket_status is only for looking up a specific ticket by ID.
    nlu_trigger:
      - intent: recall_session
        conditions:
          - active_flow: null
    steps:
      - action: action_recall_session
